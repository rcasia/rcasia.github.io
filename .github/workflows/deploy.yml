name: Deploy Astro site

on:
  push:
    branches:
      - master
      - main
  pull_request:
    branches:
      - master
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Prepare deployment metadata
        run: |
          environment=production
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            environment=ci
          fi
          {
            echo "DEPLOYMENT_COMMIT=$GITHUB_SHA"
            echo "DEPLOYMENT_BUILD_TIME=$(date -u '+%Y-%m-%dT%H:%M:%SZ')"
            echo "DEPLOYMENT_ENVIRONMENT=$environment"
          } >> "$GITHUB_ENV"

      - name: Build
        run: bun run build

      - name: Deploy
        if: github.event_name != 'pull_request'
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist
